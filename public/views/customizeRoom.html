<!doctype html>
<html lang="ru">
    <head>
        <title id="title">Настройка комнаты — OPTRF</title>
        <link id="icon" rel="shortcut icon" href="../images/logo-no-background.svg" />
        <link id="appleTouchIcon" rel="apple-touch-icon" href="../images/logo-no-background.svg" />

        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- https://ogp.me -->

        <meta property="og:type" content="{{OG_TYPE}}" />
        <meta property="og:site_name" content="{{OG_SITE_NAME}}" />
        <meta property="og:title" content="{{OG_TITLE}}" />
        <meta property="og:description" content="{{OG_DESCRIPTION}}" />
        <meta property="og:image" content="{{OG_IMAGE}}" />
        <meta property="og:url" content="{{OG_URL}}" />

        <script src="../js/ThemeInit.js"></script>
        <script defer src="../js/Theme.js"></script>
        <link rel="stylesheet" type="text/css" href="../css/CustomizeRoom.css" />
        <link rel="stylesheet" type="text/css" href="../css/optrf-room.css" />
        <link rel="stylesheet" href="../css/optrf-theme.css" />

        <!-- xss (provides filterXSS) -->
        <script src="https://cdn.jsdelivr.net/npm/xss/dist/xss.min.js"></script>
    </head>
    <body>
        <a class="cr-home" href="/" aria-label="На главную" title="На главную">
            <img src="../images/logo-on-dark.svg" alt="OPTRF" width="120" height="32" />
        </a>
        <main class="cr-page">
            <section class="cr-card" aria-label="Вход в комнату">
                <h1 class="cr-title">Настройка входа в комнату</h1>

                <form id="customizeRoomForm" class="cr-form" autocomplete="off">
                    <div class="cr-field">
                        <label class="cr-label" for="room">Комната</label>
                        <div class="cr-input-wrap">
                            <input
                                id="room"
                                name="room"
                                class="cr-input"
                                type="text"
                                inputmode="text"
                                placeholder="komnata123"
                                maxlength="64"
                                required
                            />
                            <button
                                id="crRandomRoom"
                                class="cr-input-action"
                                type="button"
                                aria-label="Сгенерировать название комнаты"
                                title="Сгенерировать название комнаты"
                            >
                                Случайное
                            </button>
                        </div>
                    </div>

                    <div class="cr-field">
                        <label class="cr-label" for="roomPassword">Пароль комнаты</label>
                        <input
                            id="roomPassword"
                            name="roomPassword"
                            class="cr-input"
                            type="password"
                            inputmode="text"
                            placeholder="Необязательный пароль"
                            maxlength="128"
                        />
                        <p class="cr-hint">Оставьте пустым, чтобы не использовать пароль.</p>
                    </div>

                    <div class="cr-field">
                        <label class="cr-label" for="name">Имя</label>
                        <input
                            id="name"
                            name="name"
                            class="cr-input"
                            type="text"
                            inputmode="text"
                            placeholder="Ваше отображаемое имя"
                            maxlength="64"
                        />
                    </div>

                    <div class="cr-field">
                        <label class="cr-label" for="avatar">URL аватара</label>
                        <input
                            id="avatar"
                            name="avatar"
                            class="cr-input"
                            type="url"
                            inputmode="url"
                            placeholder="https://..."
                            maxlength="512"
                        />
                        <p class="cr-hint">Оставьте пустым, чтобы не использовать аватар.</p>
                    </div>

                    <div class="cr-field">
                        <label class="cr-label" for="token">Токен</label>
                        <input
                            id="token"
                            name="token"
                            class="cr-input"
                            type="text"
                            inputmode="text"
                            placeholder="JWT-токен"
                            maxlength="2048"
                        />
                        <p class="cr-hint">Требуется, если включена защита ведущего или авторизация пользователей.</p>
                    </div>

                    <div class="cr-toggle-grid" aria-label="Параметры входа">
                        <label class="cr-toggle" for="audio">
                            <span class="cr-toggle-text">Аудио</span>
                            <span class="cr-switch-wrap">
                                <input id="audio" name="audio" type="checkbox" />
                                <span class="cr-switch" aria-hidden="true"></span>
                            </span>
                        </label>

                        <label class="cr-toggle" for="video">
                            <span class="cr-toggle-text">Видео</span>
                            <span class="cr-switch-wrap">
                                <input id="video" name="video" type="checkbox" />
                                <span class="cr-switch" aria-hidden="true"></span>
                            </span>
                        </label>

                        <label class="cr-toggle" for="screen">
                            <span class="cr-toggle-text">Экран</span>
                            <span class="cr-switch-wrap">
                                <input id="screen" name="screen" type="checkbox" />
                                <span class="cr-switch" aria-hidden="true"></span>
                            </span>
                        </label>

                        <label class="cr-toggle" for="chat">
                            <span class="cr-toggle-text">Чат</span>
                            <span class="cr-switch-wrap">
                                <input id="chat" name="chat" type="checkbox" />
                                <span class="cr-switch" aria-hidden="true"></span>
                            </span>
                        </label>

                        <label class="cr-toggle" for="hide">
                            <span class="cr-toggle-text">Скрыть меня</span>
                            <span class="cr-switch-wrap">
                                <input id="hide" name="hide" type="checkbox" />
                                <span class="cr-switch" aria-hidden="true"></span>
                            </span>
                        </label>

                        <label class="cr-toggle" for="notify">
                            <span class="cr-toggle-text">Поделиться</span>
                            <span class="cr-switch-wrap">
                                <input id="notify" name="notify" type="checkbox" />
                                <span class="cr-switch" aria-hidden="true"></span>
                            </span>
                        </label>
                    </div>

                    <div class="cr-field">
                        <label class="cr-label" for="duration">Продолжительность (необязательно)</label>
                        <input
                            id="duration"
                            name="duration"
                            class="cr-input"
                            type="text"
                            inputmode="numeric"
                            placeholder="00:30:00"
                            pattern="^\d{2}:\d{2}:\d{2}$"
                            maxlength="8"
                        />
                        <p class="cr-hint">Формат ЧЧ:ММ:СС. Оставьте пустым без ограничения времени.</p>
                    </div>

                    <div class="cr-field">
                        <label class="cr-label" for="crPreviewUrl">Ссылка для входа</label>
                        <div class="cr-preview-row">
                            <input id="crPreviewUrl" class="cr-input cr-preview" type="text" readonly />
                            <div class="cr-actions" aria-label="Действия со ссылкой">
                                <button id="crCopy" class="cr-copy" type="button" aria-label="Копировать ссылку">
                                    <span class="cr-copy-icon" aria-hidden="true">⧉</span>
                                    <span>Копировать</span>
                                </button>
                                <button
                                    id="crShare"
                                    class="cr-copy"
                                    type="button"
                                    aria-label="Поделиться ссылкой"
                                    hidden
                                >
                                    <span class="cr-copy-icon" aria-hidden="true">↗</span>
                                    <span>Поделиться</span>
                                </button>
                            </div>
                        </div>
                        <div id="crQrWrap" class="cr-qr-wrap" hidden>
                            <div id="crQr" class="cr-qr" role="img" aria-label="QR-код ссылки для входа"></div>
                            <p class="cr-hint cr-qr-hint">Отсканируйте камерой, чтобы открыть ссылку.</p>
                        </div>
                        <p id="crStatus" class="cr-hint" role="status" aria-live="polite"></p>
                    </div>

                    <p id="crError" class="cr-error" hidden></p>

                    <button class="cr-submit" type="submit">Войти в комнату</button>
                </form>
            </section>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
        <script src="../js/RoomNameGen.js"></script>
        <script src="../js/CustomizeRoom.js"></script>
        <script defer src="../js/RussianUI.js"></script>
    </body>
</html>
