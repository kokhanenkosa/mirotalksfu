<div class="sch-form">
    <div class="sch-field">
        <label class="sch-label" for="schTitle">
            <i class="fas fa-heading sch-icon"></i> Название встречи
            <span class="sch-required">*</span>
        </label>
        <input type="text" id="schTitle" class="sch-input" placeholder="Например, планёрка команды" maxlength="100" />
    </div>
    <div class="sch-field">
        <label class="sch-label" for="schDescription"> <i class="fas fa-align-left sch-icon"></i> Описание </label>
        <input
            type="text"
            id="schDescription"
            class="sch-input"
            placeholder="Необязательное описание"
            maxlength="255"
        />
    </div>
    <div class="sch-field">
        <label class="sch-label" for="schRoomName">
            <i class="fas fa-door-open sch-icon"></i> Название комнаты
            <span class="sch-required">*</span>
        </label>
        <input type="text" id="schRoomName" class="sch-input" placeholder="Например, планерка" maxlength="64" />
    </div>
    <div class="sch-row">
        <div class="sch-field">
            <label class="sch-label" for="schDateTime">
                <i class="fas fa-calendar-alt sch-icon"></i> Дата и время
                <span class="sch-required">*</span>
            </label>
            <input type="text" id="schDateTime" class="sch-input" placeholder="Выберите дату и время" />
        </div>
        <div class="sch-field">
            <label class="sch-label" for="schDuration">
                <i class="fas fa-clock sch-icon"></i> Продолжительность (мин)
                <span class="sch-required">*</span>
            </label>
            <input type="number" id="schDuration" class="sch-input" value="60" min="5" max="480" />
        </div>
    </div>
    <div class="sch-field">
        <label class="sch-label" for="schRecipients">
            <i class="fas fa-envelope sch-icon"></i> Получатели
            <span class="sch-required">*</span>
        </label>
        <input type="text" id="schRecipients" class="sch-input" placeholder="user@example.com, user2@example.com" />
        <p class="sch-hint">Укажите несколько адресов через запятую</p>
    </div>
</div>
