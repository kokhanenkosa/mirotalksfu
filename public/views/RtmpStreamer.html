<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- Title and Icon -->

        <title id="title">RTMP-трансляция — ОПТ РФ</title>
        <link id="icon" rel="shortcut icon" href="../images/logo-no-background.svg" />
        <link id="appleTouchIcon" rel="apple-touch-icon" href="../images/logo-no-background.svg" />

        <!-- Meta Information -->

        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <meta
            id="description"
            name="description"
            content="RTMP-трансляция видеоконференций ОПТ РФ."
        />

        <!-- StyleSheet -->

        <script src="../js/ThemeInit.js"></script>
        <script defer src="../js/Theme.js"></script>
        <link rel="stylesheet" href="../css/Root.css" />
        <link rel="stylesheet" href="../css/RtmpStreamer.css" />
        <link rel="stylesheet" href="../css/optrf-room.css" />

        <!-- https://cdnjs.com/libraries/font-awesome -->

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />
        <link rel="stylesheet" href="../css/optrf-theme.css" />

        <!-- Axios -->

        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

        <script defer src="https://cdn.jsdelivr.net/npm/xss/dist/xss.min.js"></script>

        <!-- JS scripts -->
        <script defer src="../js/Brand.js"></script>
        <script defer src="../js/RtmpStreamer.js"></script>
    </head>
    <body>
        <div id="popup" class="popup fadein hidden">
            <span id="popupMessage"></span>
            <button id="closePopup"><i class="fas fa-close"></i></button>
        </div>
        <div class="container fadein">
            <h1>RTMP-трансляция</h1>
            <div class="input-group-inline">
                <input
                    id="apiSecret"
                    type="password"
                    value="mirotalkRtmpApiSecret"
                    placeholder="Секрет API"
                    title="Введите секрет API"
                />
            </div>
            <div class="input-group-inline">
                <input
                    id="rtmp"
                    type="text"
                    value=""
                    placeholder="rtmp://server:port/app/streamKey"
                    readonly
                    title="URL RTMP-трансляции. Поле нельзя редактировать."
                />
                <button id="copy" title="Копировать RTMP URL"><i class="fas fa-paste"></i>&nbsp;Копировать</button>
            </div>

            <video id="video" width="640" height="480"></video>

            <div class="button-group">
                <button id="startCamera" title="Начать трансляцию камеры">
                    <i class="fas fa-video"></i>&nbsp;Транслировать камеру
                </button>
                <button id="startScreen" title="Начать трансляцию экрана">
                    <i class="fas fa-desktop"></i>&nbsp;Транслировать экран
                </button>
                <button id="stop" disabled title="Остановить трансляцию">
                    <i class="fas fa-stop-circle"></i>&nbsp;Остановить
                </button>
            </div>
        </div>
        <footer id="footer">
            <p>&copy; 2026 ОПТ РФ. Все права защищены.</p>
        </footer>
    </body>
</html>
