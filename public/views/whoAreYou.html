<!doctype html>
<html lang="ru" class="no-js">
    <head>
        <!-- Title and Icon -->

        <title id="title">Ожидание ведущего — ОПТ РФ</title>
        <link id="icon" rel="shortcut icon" href="../images/logo-no-background.svg" />
        <link id="appleTouchIcon" rel="apple-touch-icon" href="../images/logo-no-background.svg" />

        <!-- Meta Information -->

        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <meta
            id="description"
            name="description"
            content="Ожидание ведущего видеоконференции ОПТ РФ."
        />

        <!-- https://ogp.me -->

        <meta property="og:type" content="{{OG_TYPE}}" />
        <meta property="og:site_name" content="{{OG_SITE_NAME}}" />
        <meta property="og:title" content="{{OG_TITLE}}" />
        <meta property="og:description" content="{{OG_DESCRIPTION}}" />
        <meta property="og:image" content="{{OG_IMAGE}}" />
        <meta property="og:url" content="{{OG_URL}}" />

        <!-- StyleSheet -->

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=IBM+Plex+Sans:400,600&subset=cyrillic" />
        <link rel="stylesheet" type="text/css" href="../css/landing.css" />
        <link rel="stylesheet" type="text/css" href="../css/optrf-brand.css" />
        <link rel="stylesheet" type="text/css" href="../css/waitingRoom.css" />

        <!-- Js scripts -->

        <script async src="../js/Stats.js"></script>
        <script defer src="../js/Brand.js"></script>

        <!-- xss -->

        <script src="https://cdn.jsdelivr.net/npm/xss/dist/xss.min.js"></script>

        <!-- axios -->

        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

        <script src="https://unpkg.com/animejs@3.0.1/lib/anime.min.js"></script>
        <script src="https://unpkg.com/scrollreveal@4.0.0/dist/scrollreveal.min.js"></script>
    </head>
    <body class="is-boxed has-animations">
        <div class="body-wrap">
            <header class="site-header reveal-from-top">
                <div class="container">
                    <div class="site-header-inner">
                        <div class="brand header-brand">
                            <h1 class="m-0">
                                <a href="/">
                                    <img
                                        id="headerLogo"
                                        class="header-logo-image logo-for-light"
                                        src="../images/logo-no-background.svg"
                                        alt="ОПТ РФ"
                                    />
                                </a>
                            </h1>
                        </div>
                    </div>
                </div>
            </header>

            <main class="site-content">
                <section class="hero section center-card-section">
                    <div class="container">
                        <div class="hero-inner">
                            <div
                                class="waiting-card reveal-from-bottom"
                                data-reveal-delay="150"
                                role="status"
                                aria-live="polite"
                            >
                                <div class="waiting-icon">
                                    <i class="fa-solid fa-users"></i>
                                </div>
                                <h2 id="waitingRoomHeading" class="waiting-title">Ожидание ведущего...</h2>
                                <p id="waitingRoomDescription" class="waiting-description">
                                    Встреча ещё не началась.<br />
                                    Вы войдёте автоматически, когда ведущий откроет комнату.
                                </p>
                                <div id="waitingRoomName" class="waiting-room-name" style="display: none">
                                    <i class="fa-solid fa-door-open"></i>
                                    <span id="waitingRoomNameText"></span>
                                </div>
                                <div class="waiting-spinner">
                                    <div class="waiting-spinner-dot"></div>
                                    <div class="waiting-spinner-dot"></div>
                                    <div class="waiting-spinner-dot"></div>
                                </div>
                                <p class="waiting-status" id="waitingStatus" aria-live="assertive">
                                    Проверка статуса комнаты...
                                </p>
                                <p class="waiting-elapsed" id="waitingElapsed">
                                    <i class="fa-regular fa-clock"></i>
                                    <span id="waitingElapsedText">Ожидание только началось</span>
                                </p>
                                <hr class="waiting-divider" />
                                <div id="waitingAudioPlayer" class="waiting-audio-player" style="display: none">
                                    <button id="waitingAudioBtn" class="waiting-audio-btn" title="Включить музыку">
                                        <i id="waitingAudioIcon" class="fa-solid fa-play"></i>
                                    </button>
                                    <div class="waiting-audio-bar">
                                        <div id="waitingAudioProgress" class="waiting-audio-progress"></div>
                                    </div>
                                    <button id="waitingAudioMute" class="waiting-audio-btn" title="Выключить звук">
                                        <i id="waitingAudioMuteIcon" class="fa-solid fa-volume-high"></i>
                                    </button>
                                </div>
                                <p class="host-login-link" id="hostLoginLink">
                                    <span id="waitingRoomHostLink">Вы ведущий?</span>
                                    <a id="loginLink" href="/login"><span id="waitingRoomLoginLink">Войти</span></a>
                                </p>
                            </div>
                            <div class="hero-figure anime-element">
                                <svg class="placeholder" width="528" height="396" viewBox="0 0 528 396">
                                    <rect width="528" height="396" style="fill: transparent" />
                                </svg>
                                <div class="hero-figure-box hero-figure-box-01" data-rotation="45deg"></div>
                                <div class="hero-figure-box hero-figure-box-02" data-rotation="-45deg"></div>
                                <div class="hero-figure-box hero-figure-box-03" data-rotation="0deg"></div>
                                <div class="hero-figure-box hero-figure-box-04" data-rotation="-135deg"></div>
                                <div class="hero-figure-box hero-figure-box-05"></div>
                                <div class="hero-figure-box hero-figure-box-06"></div>
                                <div class="hero-figure-box hero-figure-box-07"></div>
                                <div class="hero-figure-box hero-figure-box-08" data-rotation="-22deg"></div>
                                <div class="hero-figure-box hero-figure-box-09" data-rotation="-52deg"></div>
                                <div class="hero-figure-box hero-figure-box-10" data-rotation="-50deg"></div>
                            </div>
                        </div>
                    </div>
                </section>
            </main>

            <footer id="footer" class="site-footer">
                <div class="container">
                    <div class="site-footer-inner">
                        <div class="brand footer-brand">
                            <a href="/"
                                ><img class="header-logo-image" src="../images/logo-on-dark.svg" alt="ОПТ РФ"
                            /></a>
                        </div>
                        <ul class="footer-links list-reset">
                            <li><a href="/">Главная</a></li>
                            <li><a href="/about">О сервисе</a></li>
                            <li><a href="/privacy">Конфиденциальность</a></li>
                        </ul>
                        <div class="footer-copyright">&copy; 2026 ОПТ РФ. Все права защищены.</div>
                    </div>
                </div>
            </footer>
        </div>
        <script async src="../js/WhoAreYou.js"></script>
        <script defer src="../js/Landing.js"></script>
    </body>
</html>
