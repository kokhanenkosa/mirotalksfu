# MiroTalk SFU — Docker Compose для Coolify
# Compose Location: /docker-compose.yaml
#
# Env (обязательно):
#   SFU_ANNOUNCED_IP  = публичный IPv4 сервера
#   SERVER_HOST_URL   = https://твой-домен.ru  (без :3010)
#
# Домен сервиса mirotalksfu в Coolify UI:
#   https://твой-домен.ru:3010
#
# Firewall: UDP+TCP 40000-40100

services:
  mirotalksfu:
    # Сборка из репо (кастомный русский лендинг). Не используй чистый mirotalk/sfu:latest.
    build:
      context: .
      dockerfile: Dockerfile
    image: optrf-mirotalksfu:local
    restart: unless-stopped
    # НЕ network_mode: host — ломает Traefik Coolify
    # НЕ объявлять networks: — Coolify создаёт сеть сам
    environment:
      # Coolify: проксирует домен на контейнерный порт 3010
      - SERVICE_URL_MIROTALKSFU_3010

      # Публичный URL сайта (задай в Coolify Env явно!)
      - SERVER_HOST_URL=${SERVER_HOST_URL:?}

      - NODE_ENV=production
      - TRUST_PROXY=true
      - SERVER_LISTEN_IP=0.0.0.0
      - SERVER_LISTEN_PORT=3010

      # Публичный IPv4 сервера (для WebRTC ICE)
      - SFU_ANNOUNCED_IP=${SFU_ANNOUNCED_IP:?}
      - SFU_LISTEN_IP=0.0.0.0
      - SFU_MIN_PORT=${SFU_MIN_PORT:-40000}
      - SFU_MAX_PORT=${SFU_MAX_PORT:-40100}
      # Не оставляй пустым на жирных CPU — иначе 30+ workers
      - SFU_NUM_WORKERS=${SFU_NUM_WORKERS:-4}
      - SFU_SERVER=${SFU_SERVER:-true}

      - UI_LANGUAGE=${UI_LANGUAGE:-ru}
      - APP_NAME=${APP_NAME:-Видеоконференции}
      - APP_TITLE=${APP_TITLE:-Видеоконференции<br />Онлайн-встречи прямо в браузере.<br />Просто. Надёжно. Быстро.}
      - APP_DESCRIPTION=${APP_DESCRIPTION:-Начните видеозвонок в один клик. Без установки программ, плагинов и регистрации — сразу к разговору, чату и демонстрации экрана.}
      - JOIN_DESCRIPTION=${JOIN_DESCRIPTION:-Введите название комнаты.<br />Например, вот такое:}
      - JOIN_BUTTON_LABEL=${JOIN_BUTTON_LABEL:-Войти в комнату}
      - CUSTOMIZE_BUTTON_LABEL=${CUSTOMIZE_BUTTON_LABEL:-Настроить комнату}
      - JOIN_LAST_LABEL=${JOIN_LAST_LABEL:-Недавняя комната:}
      - SITE_TITLE=${SITE_TITLE:-Видеоконференции — онлайн-встречи в браузере}
      - META_DESCRIPTION=${META_DESCRIPTION:-Видеоконференции в браузере: звонки, чат и демонстрация экрана без установки программ.}
      - OG_SITE_NAME=${OG_SITE_NAME:-Видеоконференции}
      - OG_TITLE=${OG_TITLE:-Присоединяйтесь к видеовстрече}
      - OG_DESCRIPTION=${OG_DESCRIPTION:-Онлайн-звонки, чат и демонстрация экрана в браузере.}
      - COPYRIGHT_TEXT=${COPYRIGHT_TEXT:-Видеоконференции. Все права защищены.}

      # Убрать спонсоров / git / внешний маркетинг с лендинга
      - SHOW_TOP_SPONSORS=false
      - SHOW_TEAMS=false
      - SHOW_POWERED_BY=false
      - SHOW_SPONSORS=false
      - SHOW_PAST_SPONSORS=false
      - SHOW_ADVERTISERS=false
      - SHOW_SUPPORT_US=false
      - SHOW_FEATURES=true
      - SHOW_TRY_EASIER=true
      - SHOW_FOOTER=true

      - JWT_SECRET=${SERVICE_PASSWORD_64_JWT}
      - API_KEY_SECRET=${SERVICE_PASSWORD_64_API}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-1h}

      - HOST_PROTECTED=${HOST_PROTECTED:-false}
      - HOST_USER_AUTH=${HOST_USER_AUTH:-false}
      - HOST_USERS=${HOST_USERS:-}

      - RECORDING_ENABLED=${RECORDING_ENABLED:-false}
      - RTMP_ENABLED=${RTMP_ENABLED:-false}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}

      # Скрыть ChatGPT / DeepSeek из списка чатов (пока нет API-ключей)
      - ENABLE_CHAT_GPT=${ENABLE_CHAT_GPT:-false}
      - ENABLE_DEEP_SEEK=${ENABLE_DEEP_SEEK:-false}
      - CHATGPT_ENABLED=${CHATGPT_ENABLED:-false}
      - DEEP_SEEK_ENABLED=${DEEP_SEEK_ENABLED:-false}
      - VIDEOAI_ENABLED=${VIDEOAI_ENABLED:-false}

      # Распознавание речи / транскрипция / голосовые команды — выкл
      - SHOW_TRANSCRIPTION=${SHOW_TRANSCRIPTION:-false}
      - SHOW_SPEECH_REC_BUTTON=${SHOW_SPEECH_REC_BUTTON:-false}
      - SHOW_CHAT_SPEECH=${SHOW_CHAT_SPEECH:-false}

      # Markdown в чате — выкл
      - SHOW_CHAT_MARKDOWN=${SHOW_CHAT_MARKDOWN:-false}

    # Coolify/Traefik ходит сюда по HTTP (httpolyglot принимает HTTP)
    expose:
      - '3010'

    ports:
      # WebRTC media — напрямую на хост
      - '${SFU_MIN_PORT:-40000}-${SFU_MAX_PORT:-40100}:${SFU_MIN_PORT:-40000}-${SFU_MAX_PORT:-40100}/udp'
      - '${SFU_MIN_PORT:-40000}-${SFU_MAX_PORT:-40100}:${SFU_MIN_PORT:-40000}-${SFU_MAX_PORT:-40100}/tcp'

    volumes:
      - mirotalksfu-rec:/src/app/rec
      - mirotalksfu-rtmp:/src/app/rtmp

    # Только TCP — HTTP fetch к httpolyglot даёт ECONNRESET и Coolify помечает unhealthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('net').createConnection(3010,'127.0.0.1').on('connect',function(){this.end();process.exit(0)}).on('error',function(){process.exit(1)})",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  mirotalksfu-rec:
  mirotalksfu-rtmp:
